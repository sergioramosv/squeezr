[proxy]
port = 8080

[compression]
threshold = 800          # min chars to compress a tool result
keep_recent = 3          # how many recent tool results to leave untouched
disabled = false
# AI compression master switch — DEFAULT FALSE. WARNING: with a Claude Code OAuth
# subscription token, every Haiku compression call bills against YOUR OWN 5h plan
# quota and can burn it faster than it saves. Only enable with a separate billed
# API key + backend = "gpt-mini" / "gemini-flash" / "local".
ai_compression = false
compress_system_prompt = true   # only runs when ai_compression = true (it makes a Haiku call)
compress_conversation = true    # deterministic clean on old user/assistant messages + tool_use inputs (pure regex, no AI)
keep_recent_assistant = 3       # leave last N assistant turns untouched
assistant_threshold = 300       # min chars before applying prose cleanup
stale_turns = true               # collapse old assistant turns when conversation > threshold (default 40)
# stale_turn_threshold = 40     # user turns before triggering stale summarization
# stale_keep_recent = 15        # keep last N turns at full fidelity
tool_desc_compress = true        # compress ALL tool descriptions (~23K tokens/request saved)
tool_desc_first_para = true      # keep only first paragraph (Bash 10K->53, Workflow 18K->263, etc.)
tool_desc_expand = true          # store full spec in expand store — Claude llama squeezr_expand('ID')
                                 # para recuperar el spec completo si lo necesita (ej: antes de escribir workflow)
# tool_desc_safe_only = true    # modo alternativo: solo built-ins sin expand (7K tokens saved, 0 riesgo)
# tool_desc_max_chars = 0       # hard-truncate adicional tras first-para (0 = off)
# mcp_block_servers = ["planning-task-mcp"]  # drop these MCP servers' tools (~18K tokens/req each)
# mcp_allow_servers = ["github-mcp"]         # if set, ONLY these MCP servers survive
# Safety: a server USED in the current conversation is never filtered.
# skip_tools = ["Read"]         # never compress these tool types (Bash, Read, Grep, Glob...)
# only_tools = ["Bash"]         # only compress these tool types — overrides skip_tools
# Per-command: add "# squeezr:skip" anywhere in a Bash command to skip that result:
#   git diff HEAD~3  # squeezr:skip

[cache]
enabled = true
max_entries = 1000       # LRU cap for cached compressions

[adaptive]
enabled = true
# Thresholds adjust based on context pressure (% of model context used)
low_threshold = 1500     # < 50% context used
mid_threshold = 800      # 50-75%
high_threshold = 400     # 75-90%
critical_threshold = 150 # > 90% — compress everything possible

[local]
enabled = true
upstream_url = "http://localhost:11434"   # your Ollama URL
# Model used to compress tool results — must be pulled in your Ollama.
# Any model works. Recommended small models:
#   qwen2.5-coder:1.5b  (best for code, ~1GB RAM)
#   qwen2.5:1.5b        (good general, ~1GB RAM)
#   llama3.2:1b         (good English, ~800MB RAM)
#   qwen2.5:3b          (better quality, ~2GB RAM)
compression_model = "qwen2.5-coder:1.5b"
# Keys that indicate a local/dummy request (not a real cloud key)
dummy_keys = ["ollama", "lm-studio", "sk-no-key-required", "local", "none", ""]
